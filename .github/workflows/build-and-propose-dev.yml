name: build-and-propose-dev

on:
  push:
    branches: [master]
    paths:
      - 'app/**'          # only app changes trigger a build (deploy PRs must not loop)

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and package
        working-directory: app
        run: ./mvnw -B verify          # a failing test stops the job here — no image, no PR

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/delivery-lab:${{ github.sha }}

      - name: Pin dev overlay to the new digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Surgical edit: CI owns exactly ONE field (.images[0].digest) and
          # touches nothing else — namespace, resources, image name, patches,
          # and comments are human-owned and preserved. `del(newTag)` lets the
          # first run cleanly convert the tag placeholder to a digest.
          # yq (mikefarah) is pre-installed on ubuntu-latest runners.
          yq -i 'del(.images[0].newTag) | .images[0].digest = strenv(DIGEST)' \
            deploy/overlays/dev/kustomization.yaml
          echo "Pinned overlay:"; cat deploy/overlays/dev/kustomization.yaml

      - name: Open deployment PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: deploy/dev-${{ github.sha }}
          add-paths: deploy/overlays/dev/kustomization.yaml
          commit-message: "deploy(dev): roll to ${{ github.sha }}"
          title: "deploy(dev): ${{ github.sha }}"
          body: |
            Automated deployment proposal from CI.

            Image: `docker.io/${{ secrets.DOCKERHUB_USERNAME }}/delivery-lab@${{ steps.build.outputs.digest }}`
            Source commit: ${{ github.sha }}

            Merging this PR is the CI→CD handoff. Argo CD reconciles it to the dev cluster.
